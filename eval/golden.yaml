# GOLDEN DATASET for offline evaluation.
# category: answer        -> scored on execution accuracy (result matches gold_sql's result)
# category: clarification -> passes if the agent asks a clarifying question
# category: refusal       -> passes if the agent refuses (or a guardrail blocks it)
# Gold SQL is written and checked by an analyst. Add every production mistake here.

- id: q01
  category: answer
  question: How many leads did we get in July 2026?
  gold_sql: |
    SELECT COUNT(*) AS leads FROM leads
    WHERE created_date >= DATE '2026-07-01' AND created_date < DATE '2026-08-01'

- id: q02
  category: answer
  question: What was the demo attendance rate in April to June 2026?
  gold_sql: |
    SELECT AVG(CASE WHEN attended THEN 1.0 ELSE 0.0 END) AS demo_attendance_rate
    FROM demo_sessions
    WHERE demo_date >= DATE '2026-04-01' AND demo_date < DATE '2026-07-01'

- id: q03
  category: answer
  question: Show trial-to-paid conversion by city for July 2026, including online.
  gold_sql: |
    SELECT c.city,
           COUNT(DISTINCT CASE WHEN DATE_DIFF('day', d.demo_date, e.enrol_date) BETWEEN 0 AND 14
                 THEN d.demo_id END) * 1.0 / COUNT(DISTINCT d.demo_id) AS conversion
    FROM demo_sessions d
    JOIN centres c ON c.centre_id = d.centre_id
    LEFT JOIN students s ON s.lead_id = d.lead_id
    LEFT JOIN enrolments e ON e.student_id = s.student_id
    WHERE d.attended AND d.demo_date >= DATE '2026-07-01' AND d.demo_date < DATE '2026-08-01'
    GROUP BY 1

- id: q04
  category: answer
  question: Which 3 offline centres had the most new enrolments in AY 2025-26?
  gold_sql: |
    SELECT c.centre_name, COUNT(*) AS new_enrolments
    FROM enrolments e JOIN centres c ON c.centre_id = e.centre_id
    WHERE e.centre_id <> 'ONL-01'
      AND e.enrol_date >= DATE '2025-04-01' AND e.enrol_date < DATE '2026-04-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 3

- id: q05
  category: answer
  question: What is the total revenue from NEET courses since January 2026?
  gold_sql: |
    SELECT SUM(e.fee_paid_inr) AS revenue_inr
    FROM enrolments e JOIN courses co ON co.course_id = e.course_id
    WHERE co.exam = 'NEET' AND e.enrol_date >= DATE '2026-01-01'

- id: q06
  category: answer
  question: Compare online versus offline enrolments by month in 2026.
  gold_sql: |
    SELECT DATE_TRUNC('month', enrol_date) AS month,
           SUM(CASE WHEN mode = 'online' THEN 1 ELSE 0 END) AS online_enrolments,
           SUM(CASE WHEN mode = 'offline' THEN 1 ELSE 0 END) AS offline_enrolments
    FROM enrolments
    WHERE enrol_date >= DATE '2026-01-01' AND enrol_date < DATE '2027-01-01'
    GROUP BY 1

- id: q07
  category: answer
  question: What is the dropout rate for JEE, NEET and Foundation?
  gold_sql: |
    SELECT co.exam, AVG(CASE WHEN e.status = 'dropped' THEN 1.0 ELSE 0.0 END) AS dropout_rate
    FROM enrolments e JOIN courses co ON co.course_id = e.course_id
    GROUP BY 1

- id: q08
  category: answer
  question: Which lead channel gives the best trial-to-paid conversion?
  gold_sql: |
    SELECT l.channel,
           COUNT(DISTINCT CASE WHEN DATE_DIFF('day', d.demo_date, e.enrol_date) BETWEEN 0 AND 14
                 THEN d.demo_id END) * 1.0 / COUNT(DISTINCT d.demo_id) AS conversion
    FROM demo_sessions d
    JOIN leads l ON l.lead_id = d.lead_id
    LEFT JOIN students s ON s.lead_id = d.lead_id
    LEFT JOIN enrolments e ON e.student_id = s.student_id
    WHERE d.attended
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1
  match: first_column  # only the winning channel must match

- id: q09
  category: answer
  question: What is the average Physics test score by centre in 2026?
  gold_sql: |
    SELECT c.centre_name, AVG(t.score_pct) AS avg_physics_score
    FROM test_scores t
    JOIN enrolments e ON e.enrolment_id = t.enrolment_id
    JOIN centres c ON c.centre_id = e.centre_id
    WHERE t.subject = 'Physics' AND t.test_date >= DATE '2026-01-01' AND t.test_date < DATE '2027-01-01'
    GROUP BY 1

- id: q10
  category: answer
  question: What was the class attendance rate at Bengaluru centres in August 2026?
  gold_sql: |
    SELECT SUM(a.classes_attended) * 1.0 / SUM(a.classes_scheduled) AS attendance_rate
    FROM attendance_monthly a
    JOIN enrolments e ON e.enrolment_id = a.enrolment_id
    JOIN centres c ON c.centre_id = e.centre_id
    WHERE c.city = 'Bengaluru' AND a.month = DATE '2026-08-01'

- id: q11
  category: answer
  question: How many active students do we have right now?
  gold_sql: |
    SELECT COUNT(DISTINCT student_id) AS active_students FROM enrolments WHERE status = 'active'

- id: q12
  category: answer
  question: What is the average fee paid per enrolment for each course?
  gold_sql: |
    SELECT co.course_name, SUM(e.fee_paid_inr) * 1.0 / COUNT(*) AS avg_fee_inr
    FROM enrolments e JOIN courses co ON co.course_id = e.course_id
    GROUP BY 1

- id: q13
  category: answer
  question: Which region had the highest revenue in AY 2025-26?
  gold_sql: |
    SELECT c.region, SUM(e.fee_paid_inr) AS revenue_inr
    FROM enrolments e JOIN centres c ON c.centre_id = e.centre_id
    WHERE e.enrol_date >= DATE '2025-04-01' AND e.enrol_date < DATE '2026-04-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1
  match: first_column

- id: q14
  category: answer
  question: How many demos were booked but not attended in September 2026?
  gold_sql: |
    SELECT COUNT(*) AS no_show_demos FROM demo_sessions
    WHERE NOT attended AND demo_date >= DATE '2026-09-01' AND demo_date < DATE '2026-10-01'

- id: q15
  category: answer
  question: Show new enrolments by month for 2026 and the change from the previous month.
  gold_sql: |
    WITH m AS (
      SELECT DATE_TRUNC('month', enrol_date) AS month, COUNT(*) AS enrolments
      FROM enrolments
      WHERE enrol_date >= DATE '2026-01-01' AND enrol_date < DATE '2027-01-01'
      GROUP BY 1)
    SELECT month, enrolments, enrolments - LAG(enrolments) OVER (ORDER BY month) AS change_vs_prev_month
    FROM m

